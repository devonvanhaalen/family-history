<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family History</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #efe9e1;
    color: #2b2420;
    min-height: 100vh;
  }

  .banner {
    background: linear-gradient(135deg, #3d2b1f 0%, #1f150e 100%);
    color: #f4ead9;
    padding: 70px 20px 60px;
    text-align: center;
    border-bottom-left-radius: 40px;
    border-bottom-right-radius: 40px;
  }

  .banner h1 {
    font-family: 'Fraunces', serif;
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  .banner p {
    font-size: 15px;
    color: #cbb89a;
    letter-spacing: 0.3px;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .view-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    justify-content: center;
  }

  .view-buttons button {
    padding: 12px 22px;
    border-radius: 30px;
    border: 1px solid #d8cbb5;
    background: white;
    color: #6b5b45;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: all 0.25s ease;
  }

  .view-buttons button.active {
    background: #3d2b1f;
    color: #f4ead9;
    border-color: #3d2b1f;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .controls input, .controls select {
    padding: 14px 18px;
    border: 1px solid #d8cbb5;
    border-radius: 16px;
    font-size: 14px;
    background: white;
    font-family: inherit;
    color: #2b2420;
  }

  .count {
    font-size: 12px;
    color: #8a7a63;
    margin-bottom: 22px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .family-list {
    display: grid;
    gap: 18px;
  }

  .person-card {
    background: white;
    border-radius: 22px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(61, 43, 31, 0.06);
    transition: box-shadow 0.25s ease, transform 0.15s ease;
    border: 1px solid #ece2d3;
  }

  .person-card:hover {
    box-shadow: 0 8px 24px rgba(61, 43, 31, 0.12);
    transform: translateY(-2px);
  }

  .person-header {
    padding: 22px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c89b6e, #a97a4a);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    flex-shrink: 0;
  }

  .person-main { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }

  .person-info h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    margin: 0 0 5px 0;
    font-size: 18px;
    color: #2b2420;
  }

  .person-info p {
    margin: 0;
    font-size: 12px;
    color: #9a8a70;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .person-summary {
    margin: 0;
    font-size: 13px;
    color: #7a6b55;
    max-width: 190px;
    text-align: right;
    flex-shrink: 0;
    line-height: 1.4;
  }

  .chevron {
    color: #c89b6e;
    font-size: 14px;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }

  .person-card.expanded .chevron { transform: rotate(180deg); }

  .person-details {
    display: none;
    padding: 4px 24px 24px;
    border-top: 1px solid #f1e9dc;
    background: #fdfbf8;
  }

  .person-details.expanded { display: block; }

  .person-details p {
    margin: 16px 0 0 0;
    font-size: 14px;
    line-height: 1.7;
    color: #4a3f32;
  }

  .person-details h4 {
    font-size: 11px;
    color: #a97a4a;
    margin: 18px 0 8px 0;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .relation-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .relation-item { font-size: 13px; color: #2b2420; }
  .relation-item span { color: #9a8a70; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 3px; letter-spacing: 0.3px; }

  .learn-more-btn {
    margin-top: 18px;
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    background: #f1e4cf;
    color: #7a5230;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }

  .full-story {
    display: none;
    margin-top: 14px;
    padding: 16px;
    background: #f7f1e6;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.7;
    color: #4a3f32;
  }
  .full-story.expanded { display: block; }

  .more-coming {
    margin-top: 14px;
    padding: 12px 16px;
    background: #fdf6ea;
    border: 1px dashed #d8b98a;
    border-radius: 14px;
    font-size: 12px;
    color: #9a7a4a;
    font-style: italic;
  }

  .timeline-view { display: none; }
  .timeline-view.active { display: block; }

  .timeline-view h2 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    margin-bottom: 26px;
    color: #2b2420;
  }

  .timeline-event {
    padding: 14px 20px;
    border-left: 3px solid #c89b6e;
    margin-bottom: 14px;
    background: white;
    border-radius: 0 16px 16px 0;
  }

  .timeline-year { font-family: 'Fraunces', serif; font-size: 17px; color: #7a5230; font-weight: 600; }
  .timeline-text { font-size: 13px; color: #4a3f32; margin-top: 2px; }

  footer {
    margin-top: 50px;
    padding-top: 24px;
    border-top: 1px solid #dccdb2;
    text-align: center;
    color: #9a8a70;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="banner">
  <h1>Family History</h1>
  <p>CLICK ANY NAME TO EXPLORE THEIR STORY</p>
</div>

<div class="container">
  <div class="view-buttons">
    <button class="active" onclick="setView('tree', event)">Family Tree</button>
    <button onclick="setView('timeline', event)">Timeline</button>
  </div>

  <div id="treeView">
    <div class="controls">
      <input type="text" id="search" placeholder="Search family members..." onkeyup="filterFamily()">
      <select id="generation" onchange="filterFamily()">
        <option value="all">All Generations</option>
        <option value="-1">Grandchildren</option>
        <option value="0">Your Generation</option>
        <option value="1">Parents</option>
        <option value="2">Grandparents</option>
        <option value="3">Great-Grandparents</option>
      </select>
    </div>
    <div class="count"><span id="count"></span> family members</div>
    <div id="familyList" class="family-list"></div>
  </div>

  <div id="timelineView" class="timeline-view">
    <h2>Family Timeline</h2>
    <div id="timelineContent"></div>
  </div>

  <footer>Family history, gathered and growing &bull; Share with the family</footer>
</div>

<script>
const familyData = [
  {
    id: 'devon', name: 'Devon van Haalen', generation: 0, relation: 'You', birthYear: 1982,
    summary: 'Daughter of Kay and Richard.',
    bio: 'Devon grew up in New Zealand with a strong background in economics and strategic analysis. Known for thoughtfulness and attention to detail. Married to Ryan, mother to Lewis and Harvey.',
    spouseName: 'Ryan van Haalen', childrenNames: ['Lewis van Haalen', 'Harvey van Haalen']
  },
  {
    id: 'ryan', name: 'Ryan van Haalen', generation: 0, relation: "Devon's husband", birthYear: 1982,
    summary: "Devon's husband, father of Lewis and Harvey.",
    bio: 'Ryan is married to Devon and father to Lewis and Harvey.',
    spouseName: 'Devon van Haalen', childrenNames: ['Lewis van Haalen', 'Harvey van Haalen']
  },
  {
    id: 'caroline', name: 'Caroline Switzer-Carter', generation: 0, relation: 'Sister', birthYear: 1986,
    summary: 'Your sister, based internationally.',
    bio: 'Caroline maintains family connections across geographical distances, staying close with mother Kay and sister Devon. Married to Kit, mother to Ramona and Nelle.',
    spouseName: 'Kit Atkinson', childrenNames: ['Ramona Atkinson Carter', 'Nelle Susan Atkinson']
  },
  {
    id: 'kit', name: 'Kit Atkinson', generation: 0, relation: "Caroline's husband", birthYear: 1981,
    summary: "Caroline's husband, father of Ramona and Nelle.",
    bio: 'Kit is married to Caroline and father to Ramona and Nelle.',
    spouseName: 'Caroline Switzer-Carter', childrenNames: ['Ramona Atkinson Carter', 'Nelle Susan Atkinson']
  },
  {
    id: 'kay', name: 'Kay Switzer', generation: 1, relation: 'Mother', birthYear: 1950,
    summary: 'Family historian and genealogist.',
    bio: 'Kay has spent years researching and documenting family history. She has pursued extensive genealogical research into the family\'s Scottish heritage, uncovering stories spanning Scotland, the West Indies, and New Zealand.',
    spouseName: 'Richard Carter', childrenNames: ['Devon van Haalen', 'Caroline Switzer-Carter']
  },
  {
    id: 'dick', name: 'Richard Carter', generation: 1, relation: 'Father', birthYear: 1948,
    summary: 'Husband of Kay. Scottish heritage.',
    bio: 'Richard is married to Kay and father to Devon and Caroline. His family history traces back to the Inglis family of Inverness, Scotland, and their colonial history in the West Indies and British Guyana.',
    spouseName: 'Kay Switzer', childrenNames: ['Devon van Haalen', 'Caroline Switzer-Carter']
  },
  {
    id: 'harvey', name: 'Harvey van Haalen', generation: -1, relation: "Devon's son", birthYear: 2016,
    summary: "Devon and Ryan's son.",
    bio: 'Harvey is the son of Devon and Ryan.'
  },
  {
    id: 'lewis', name: 'Lewis van Haalen', generation: -1, relation: "Devon's son", birthYear: 2014,
    summary: "Devon and Ryan's son.",
    bio: 'Lewis is the son of Devon and Ryan.'
  },
  {
    id: 'ramona', name: 'Ramona Atkinson Carter', generation: -1, relation: "Caroline's daughter", birthYear: 2016,
    summary: "Caroline and Kit's daughter.",
    bio: 'Ramona is the daughter of Caroline and Kit.'
  },
  {
    id: 'nelle', name: 'Nelle Susan Atkinson', generation: -1, relation: "Caroline's daughter", birthYear: 2020,
    summary: "Caroline and Kit's daughter.",
    bio: 'Nelle is the daughter of Caroline and Kit.'
  },
  {
    id: 'george-inglis', name: 'George Inglis', generation: 2, relation: 'Great-great-grandfather', birthYear: 1760,
    summary: 'Plantation owner, West Indies & Guyana.',
    bio: 'George Inglis left Scotland to seek his fortune in the colonial world, becoming a plantation owner in the West Indies and British Guyana. He partnered with Suzanne Kerr, a "free mulatto woman," and together they had four children. George eventually lost his fortune attempting to revive failing plantations.',
    fullStory: 'He left behind a detailed journal expressing deep regret over his financial ruin, and gave explicit instructions for the humane treatment of the enslaved people under his care &mdash; particularly the young and the sick. His story sits at the uncomfortable intersection of ambition, colonial violence, and personal reckoning, and reflects a man grappling, imperfectly, with the moral weight of his choices.',
    hasMore: true
  },
  {
    id: 'suzanne-kerr', name: 'Suzanne Kerr', generation: 2, relation: 'Great-great-grandmother', birthYear: 1765,
    summary: 'A free woman who built her own prosperity.',
    bio: 'Suzanne Kerr described herself as a "free mulatto woman" &mdash; formerly enslaved, of mixed African and European descent. She partnered with George Inglis in the West Indies, and together they raised four children.',
    fullStory: 'When George brought their children to Scotland to be educated, Suzanne remained in the West Indies and built her own considerable prosperity &mdash; by 1814 she owned 14 enslaved people. In her will she wrote proudly of her three sons\' careers in the navy and army, leaving each of them £100, with the remainder of her estate passing to her daughter Helen. Her life reflects both the harsh constraints and the remarkable agency available to a Black woman of her era.',
    hasMore: true
  },
  {
    id: 'helen-inglis', name: 'Helen Inglis (later Hepburn)', generation: 1, relation: 'Great-great-grandmother', birthYear: 1800,
    summary: 'Daughter of George and Suzanne. Eloped at 14.',
    bio: 'Helen was born in the West Indies to George Inglis and Suzanne Kerr. Brought to Scotland for her education at around age five, she was separated from her mother &mdash; a rupture that would have shaped her deeply.',
    fullStory: 'At just fourteen, Helen eloped with eighteen-year-old George Hepburn, and the pair married in Edinburgh. She went on to have several children, including Emma, and became something of a bridge figure &mdash; carrying both her Scottish upbringing and her West Indian heritage into a new chapter of the family story.',
    hasMore: true
  },
  {
    id: 'george-hepburn', name: 'George Hepburn', generation: 1, relation: 'Great-great-grandfather', birthYear: 1796,
    summary: "Ship's master, lost at sea.",
    bio: 'George married Helen Inglis when he was eighteen, and became master of a ship engaged in the West Indies trade &mdash; the very route that had shaped his wife\'s family history.',
    fullStory: 'He and Helen had several children together. George\'s life at sea ultimately proved fatal &mdash; his ship was wrecked, leaving Helen a widow with children still to raise.',
    hasMore: true
  },
  {
    id: 'emma-brown', name: 'Emma (Hepburn) Brown', generation: 0, relation: 'Great-great-grandmother', birthYear: 1815,
    summary: 'Emigrated to New Zealand.',
    bio: 'Born in Edinburgh to Helen and George Hepburn, Emma married James Brown and together they made the long journey from Scotland to New Zealand &mdash; the decision that planted this branch of the family here.',
    fullStory: 'Emma would have been a young woman when she made this journey, leaving behind the world of Scottish and West Indian colonial history that had shaped her parents and grandparents, and stepping into an entirely new chapter for the family.',
    hasMore: true
  },
  {
    id: 'james-brown', name: 'James Brown', generation: 0, relation: 'Great-great-grandfather', birthYear: 1810,
    summary: 'Emigrated to New Zealand with Emma.',
    bio: 'James married Emma Hepburn and emigrated with her to New Zealand, establishing the family roots that would eventually lead to Richard\'s birth.',
    fullStory: 'Details of James\'s early life and motivations for emigrating are still being uncovered.',
    hasMore: true
  },
  {
    id: 'alexander-inglis', name: 'Alexander Inglis', generation: 3, relation: 'Great-great-great-grandfather', birthYear: 1730,
    summary: 'Wealthy Scottish merchant.',
    bio: 'Alexander built the impressive Kingsmill estate near Inverness in the 1780s &mdash; now a luxury hotel &mdash; through his success as a merchant.',
    fullStory: 'His sons went on to take strikingly different paths: some pursued colonial fortune abroad, while others chose to stay and shape civic life at home in Scotland.',
    hasMore: true
  },
  {
    id: 'william-inglis', name: 'William Inglis', generation: 3, relation: 'Great-great-uncle', birthYear: 1762,
    summary: "George's brother. Provost of Inverness.",
    bio: 'Unlike his brother George, William chose to remain in Scotland. He used profits from the family\'s West Indies business to fund civic improvements, and served as Provost of Inverness for ten years.',
    fullStory: 'Under his leadership, schools and a hospital were built for the town. In his later years William struggled with depression, and died by suicide, throwing himself from a bridge. A street in Inverness still bears his name &mdash; a quiet, lasting trace of a complicated life.',
    hasMore: true
  }
];

const timelineEvents = [
  { year: 1730, person: 'Alexander Inglis', event: 'Born' },
  { year: 1760, person: 'George Inglis', event: 'Born' },
  { year: 1762, person: 'William Inglis', event: 'Born' },
  { year: 1765, person: 'Suzanne Kerr', event: 'Born' },
  { year: 1796, person: 'George Hepburn', event: 'Born' },
  { year: 1800, person: 'Helen Inglis', event: 'Born' },
  { year: 1810, person: 'James Brown', event: 'Born' },
  { year: 1815, person: 'Emma Brown', event: 'Born' },
  { year: 1948, person: 'Richard Carter', event: 'Born' },
  { year: 1950, person: 'Kay Switzer', event: 'Born' },
  { year: 1981, person: 'Kit Atkinson', event: 'Born' },
  { year: 1982, person: 'Devon van Haalen', event: 'Born' },
  { year: 1982, person: 'Ryan van Haalen', event: 'Born' },
  { year: 1986, person: 'Caroline Switzer-Carter', event: 'Born' },
  { year: 2014, person: 'Lewis van Haalen', event: 'Born' },
  { year: 2016, person: 'Harvey van Haalen', event: 'Born' },
  { year: 2016, person: 'Ramona Atkinson Carter', event: 'Born' },
  { year: 2020, person: 'Nelle Susan Atkinson', event: 'Born' }
].sort(function(a,b){ return a.year - b.year; });

function initials(name) {
  return name.split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
}

function cardHTML(p) {
  const relations = [];
  if (p.spouseName) relations.push('<div class="relation-item"><span>Married to</span>' + p.spouseName + '</div>');
  if (p.childrenNames && p.childrenNames.length) relations.push('<div class="relation-item"><span>Children</span>' + p.childrenNames.join(', ') + '</div>');

  return '' +
    '<div class="person-card" id="card-' + p.id + '">' +
      '<div class="person-header" onclick="togglePerson(\'' + p.id + '\')">' +
        '<div class="person-main">' +
          '<div class="avatar">' + initials(p.name) + '</div>' +
          '<div class="person-info">' +
            '<h3>' + p.name + '</h3>' +
            '<p>' + p.relation + (p.birthYear ? ' &bull; b. ' + p.birthYear : '') + '</p>' +
          '</div>' +
        '</div>' +
        '<p class="person-summary">' + p.summary + '</p>' +
        '<span class="chevron">&#9662;</span>' +
      '</div>' +
      '<div class="person-details" id="details-' + p.id + '">' +
        '<p>' + p.bio + '</p>' +
        (relations.length ? '<h4>Family</h4><div class="relation-row">' + relations.join('') + '</div>' : '') +
        (p.hasMore ?
          '<button class="learn-more-btn" onclick="toggleStory(event, \'' + p.id + '\')">Learn more</button>' +
          '<div class="full-story" id="story-' + p.id + '"><p style="margin-top:0;">' + p.fullStory + '</p></div>' +
          '<div class="more-coming">More of this story is on its way as Kay shares further memories.</div>'
          : '') +
      '</div>' +
    '</div>';
}

function renderFamily(list) {
  document.getElementById('familyList').innerHTML = list.map(cardHTML).join('');
  document.getElementById('count').textContent = list.length;
}

function renderTimeline() {
  document.getElementById('timelineContent').innerHTML = timelineEvents.map(function(e){
    return '<div class="timeline-event">' +
      '<div class="timeline-year">' + e.year + '</div>' +
      '<div class="timeline-text"><strong>' + e.person + '</strong> &mdash; ' + e.event + '</div>' +
    '</div>';
  }).join('');
}

function togglePerson(id) {
  document.getElementById('card-' + id).classList.toggle('expanded');
  document.getElementById('details-' + id).classList.toggle('expanded');
}

function toggleStory(event, id) {
  event.stopPropagation();
  document.getElementById('story-' + id).classList.toggle('expanded');
}

function filterFamily() {
  const search = document.getElementById('search').value.toLowerCase();
  const generation = document.getElementById('generation').value;
  const filtered = familyData.filter(function(p){
    const matchesSearch = p.name.toLowerCase().includes(search);
    const matchesGen = generation === 'all' || p.generation === parseInt(generation);
    return matchesSearch && matchesGen;
  });
  renderFamily(filtered);
}

function setView(view, evt) {
  document.querySelectorAll('.view-buttons button').forEach(function(b){ b.classList.remove('active'); });
  evt.target.classList.add('active');
  document.getElementById('treeView').style.display = view === 'tree' ? 'block' : 'none';
  document.getElementById('timelineView').classList.toggle('active', view === 'timeline');
}

renderFamily(familyData);
renderTimeline();
</script>
</body>
</html>
